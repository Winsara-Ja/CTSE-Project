name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SonarCloud Scan
        if: ${{ secrets.SONAR_TOKEN != '' && vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '' }}
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=user-service,product-service,order-service,payment-service,frontend
            -Dsonar.exclusions=**/node_modules/**,**/coverage/**,frontend/dist/**,frontend/node_modules/**

      - name: Skip SonarCloud
        if: ${{ !(secrets.SONAR_TOKEN != '' && vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '') }}
        run: echo "SonarCloud scan skipped - SONAR_TOKEN or SonarCloud repository variables are not configured"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Build and push User Service
        run: |
          docker build -t shopzone-user-service ./user-service
          docker tag shopzone-user-service:latest 978163710249.dkr.ecr.ap-south-1.amazonaws.com/shopzone-user-service:latest
          docker push 978163710249.dkr.ecr.ap-south-1.amazonaws.com/shopzone-user-service:latest

      - name: Build and push Product Service
        run: |
          docker build -t shopzone-product-service ./product-service
          docker tag shopzone-product-service:latest 978163710249.dkr.ecr.ap-south-1.amazonaws.com/shopzone-product-service:latest
          docker push 978163710249.dkr.ecr.ap-south-1.amazonaws.com/shopzone-product-service:latest

      - name: Build and push Order Service
        run: |
          docker build -t shopzone-order-service ./order-service
          docker tag shopzone-order-service:latest 978163710249.dkr.ecr.ap-south-1.amazonaws.com/shopzone-order-service:latest
          docker push 978163710249.dkr.ecr.ap-south-1.amazonaws.com/shopzone-order-service:latest

      - name: Build and push Payment Service
        run: |
          docker build -t shopzone-payment-service ./payment-service
          docker tag shopzone-payment-service:latest 978163710249.dkr.ecr.ap-south-1.amazonaws.com/shopzone-payment-service:latest
          docker push 978163710249.dkr.ecr.ap-south-1.amazonaws.com/shopzone-payment-service:latest

      - name: Deploy services to ECS
        run: |
          aws ecs update-service --cluster shopzone-cluster0 --service user-service --force-new-deployment
          aws ecs update-service --cluster shopzone-cluster0 --service product-service --force-new-deployment
          aws ecs update-service --cluster shopzone-cluster0 --service order-service --force-new-deployment
          aws ecs update-service --cluster shopzone-cluster0 --service payment-service --force-new-deployment
